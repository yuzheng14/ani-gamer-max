[workspace]
resolver = "3"
members = ["crates/agm_core"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
tokio = { version = "1.43", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
